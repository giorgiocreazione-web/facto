# Smoke E2E del runtime sui 3 OS — la prova "universale", non la presunzione.
# macOS qui e' un Mac vero (headless): copre runtime, PATH, EOL, sh del git hook.
name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest      # il pavimento dichiarato (requires-python >= 3.9)
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Smoke E2E runtime (build wheel + install + hook + MCP + CLI + dashboard)
        run: python tools/smoke_e2e.py
      - name: Deterministic multi-agent proof (each tool's config launches a live Facto MCP server)
        shell: bash
        run: |
          python tools/build_wheel.py
          python -m pip install --no-index --find-links dist facto-memory
          python tools/mcp_config_check.py
